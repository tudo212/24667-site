<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>页面不存在｜24667 思无涯</title>
<style>
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#14171A;background:#fff}
  .wrap{max-width:1100px;margin:0 auto;padding:0 28px}
  .eyebrow{margin-top:110px;font:11px/1 Arial;letter-spacing:.2em;color:#6E7681;text-transform:uppercase}
  h1{font:800 clamp(46px,9vw,104px)/.9 Arial,Helvetica,sans-serif;letter-spacing:-.04em;margin:22px 0 0}
  h1 span{display:block}
  .red{color:#C8102E}
  p{margin:26px 0 0;font-size:17px;color:#3B424B}
  .btns{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap}
  a{display:inline-flex;align-items:center;height:46px;padding:0 22px;text-decoration:none;font-size:14px;font-weight:600;border:1px solid #14171A}
  .primary{background:#14171A;color:#fff}
  .ghost{color:#14171A}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">404</div>
  <h1><span>没有</span><span class="red">这一页</span></h1>
  <p>地址可能拼错了，或者页面已经挪走。</p>
  <div class="btns">
    <a class="primary" id="home" href="/">回首页</a>
    <a class="ghost" id="seasons" href="/seasons/">赛季档案</a>
  </div>
</div>
<script>
  (function () {
    var base = location.pathname.indexOf('/24667-site/') === 0 ? '/24667-site/' : '/';
    document.getElementById('home').href = base;
    document.getElementById('seasons').href = base + 'seasons/';
  })();
</script>
</body>
</html>
